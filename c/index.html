<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money IQ Challenge</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #001c82 0%, #0d47a1 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    color: #fff; padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 40px 30px;
    max-width: 400px; width: 100%;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .logo { font-size: 48px; margin-bottom: 10px; }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  .subtitle { font-size: 14px; opacity: 0.8; margin-bottom: 30px; }
  .challenge-box {
    background: rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .challenge-box p { font-size: 13px; opacity: 0.8; margin-bottom: 6px; }
  .challenger { font-size: 22px; font-weight: 700; }
  .score-label { font-size: 13px; opacity: 0.8; margin-top: 10px; }
  .score { font-size: 36px; font-weight: 900; color: #4fc3f7; }
  .btn {
    display: block; width: 100%;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px; font-weight: 700;
    text-decoration: none;
    cursor: pointer; border: none;
    transition: transform 0.1s, opacity 0.2s;
    margin-bottom: 12px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #4fc3f7; color: #001c82; }
  .btn-secondary {
    background: transparent;
    color: #fff;
    border: 2px solid rgba(255,255,255,0.5);
    font-size: 14px; padding: 12px;
  }
  .woi { margin-top: 24px; font-size: 12px; opacity: 0.6; }
  #loading { opacity: 0.8; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🧠</div>
  <h1>Money IQ</h1>
  <p class="subtitle">by Wealth Ocean Institute</p>

  <div id="loading"><p>Loading challenge...</p></div>

  <div id="content" style="display:none">
    <div class="challenge-box">
      <p>challenged you!</p>
      <div class="challenger" id="chalName">—</div>
      <div class="score-label">scored</div>
      <div class="score" id="chalScore">—</div>
      <div style="font-size:13px;opacity:0.8;margin-top:4px" id="chalMode">—</div>
    </div>

    <a id="btnOpen" class="btn btn-primary" href="#">
      🚀 Accept Challenge &amp; Play
    </a>
    <a href="https://play.google.com/store/apps/details?id=com.wealthocean.moneyiq"
       class="btn btn-secondary">
      📲 Get the App
    </a>
  </div>

  <div id="noChallenge" style="display:none">
    <p style="margin-bottom:20px;opacity:0.8">Test your financial knowledge and challenge your friends!</p>
    <a href="https://play.google.com/store/apps/details?id=com.wealthocean.moneyiq"
       class="btn btn-primary">
      📲 Download Money IQ
    </a>
  </div>

  <div class="woi">Wealth Ocean Institute · Mysuru</div>
</div>

<script>
const PKG = 'com.wealthocean.moneyiq';
const PLAY = 'https://play.google.com/store/apps/details?id=' + PKG;

function decode() {
  try {
    const params = new URLSearchParams(window.location.search);
    const d = params.get('d');
    if (!d) return null;
    const raw = atob(d.replace(/-/g,'+').replace(/_/g,'/'));
    const parts = raw.split('|');
    if (parts.length < 6) return null;
    return { ver: parts[0], bank: parts[1], mode: parts[2], name: parts[3], score: parts[4], seed: parts[5] };
  } catch(e) { return null; }
}

window.onload = function() {
  const ch = decode();
  document.getElementById('loading').style.display = 'none';

  if (ch) {
    document.getElementById('content').style.display = 'block';
    document.getElementById('chalName').textContent = ch.name || 'Someone';
    document.getElementById('chalScore').textContent = ch.score;
    document.getElementById('chalMode').textContent =
      ch.mode === 'F' ? 'Financial IQ' : 'Investment IQ';

    const data = window.location.search.slice(1); // ?d=...
    const intentUrl =
      'intent://challenge?' + data +
      '#Intent;scheme=moneyiq;package=' + PKG +
      ';S.browser_fallback_url=' + encodeURIComponent(PLAY + '&referrer=' + encodeURIComponent('c=' + data)) +
      ';end';
    document.getElementById('btnOpen').href = intentUrl;
  } else {
    document.getElementById('noChallenge').style.display = 'block';
  }
};
</script>
</body>
</html>
